# 对应 docs/ARCHITECTURE.md §6.1。只起基础设施:docker compose up -d mysql redis qdrant
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # 构建时固定 /api/* 的转发目标(rewrites 不读运行时变量)
      args:
        API_PROXY_TARGET: 'http://api:4000'
        # 构建期内联进客户端包;改值后需 docker compose up --build
        NEXT_PUBLIC_AGG_EDGE_OPACITY: '${NEXT_PUBLIC_AGG_EDGE_OPACITY:-0.3}'
    ports: ['3000:3000']
    restart: unless-stopped
    depends_on: [api]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    ports: ['4000:4000']
    env_file: .env
    # T-213:/files 只读 worker 保留的源码快照
    environment: { REPOS_DIR: /data/repos }
    volumes: ['repos:/data/repos:ro']
    restart: unless-stopped
    # 只有 api 跑迁移(GET_LOCK 互斥);DB/Redis 健康后再启动,连接仍有有限次重试兜底
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 10s
      retries: 3
  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    env_file: .env
    environment: { REPOS_DIR: /data/repos }
    volumes: [repos:/data/repos]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 2g
    cpus: 1.5
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    # worker 不跑迁移,启动时等待 schema 就绪(waitForSchema,有限次重试)
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }
  mysql:
    image: mysql:8.4
    environment: [MYSQL_DATABASE=repolens, 'MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-change-me}']
    ports: ['127.0.0.1:3306:3306']
    volumes: [mysql:/var/lib/mysql]
    restart: unless-stopped
    # 走 TCP:初始化阶段的临时实例关闭网络,ping 不会提前成功
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.12.4
    environment: ['QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-change-me}']
    volumes: [qdrant:/qdrant/storage]
    restart: unless-stopped
    # 不对公网暴露;仅本机回环,便于本地开发
    ports: ['127.0.0.1:6333:6333']
volumes: { repos: {}, mysql: {}, qdrant: {} }
