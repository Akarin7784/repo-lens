# 对应 docs/ARCHITECTURE.md §6.1。只起基础设施:docker compose up -d mysql redis qdrant
services:
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ['3000:3000']
    environment: [API_BASE_URL=http://api:4000]
    depends_on: [api]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    ports: ['4000:4000']
    env_file: .env
    depends_on: [mysql, redis, qdrant]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 10s
      retries: 3
  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    env_file: .env
    volumes: [repos:/data/repos]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 2g
    cpus: 1.5
    security_opt: ['no-new-privileges:true']
    depends_on: [mysql, redis, qdrant]
  mysql:
    image: mysql:8.4
    environment: [MYSQL_DATABASE=repolens, 'MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-change-me}']
    ports: ['127.0.0.1:3306:3306']
    volumes: [mysql:/var/lib/mysql]
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
  qdrant:
    image: qdrant/qdrant:v1.12.4
    environment: ['QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-change-me}']
    volumes: [qdrant:/qdrant/storage]
    # 不对公网暴露;仅本机回环,便于本地开发
    ports: ['127.0.0.1:6333:6333']
volumes: { repos: {}, mysql: {}, qdrant: {} }
