name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: docker compose config
        run: cp .env.example .env && docker compose config -q
  smoke:
    # T-005:真实构建镜像、起 compose、请求 /health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: smoke
        run: bash scripts/ci-smoke.sh
      - name: compose logs
        if: always()
        run: docker compose logs --no-color || true
      - name: compose down
        if: always()
        run: docker compose down -v || true
